<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSutra Admin</title>
    <style>
        :root { --bg: #0f0f0f; --card: #1a1a1a; --text: #eee; --accent: #ffd700; --danger: #ff4444; --success: #00C851; }
        body { font-family: monospace; background: var(--bg); color: var(--text); padding: 20px; max-width: 900px; margin: 0 auto; }
        
        input, select { background: #333; border: 1px solid #555; color: white; padding: 5px; border-radius: 4px; }
        button { cursor: pointer; padding: 5px 10px; border: none; border-radius: 4px; font-weight: bold; }
        .btn-save { background: var(--accent); color: black; }
        .btn-del { background: var(--danger); color: white; }

        /* Login Modal */
        #loginOverlay { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 10; }
        
        /* Layout */
        .user-card { background: var(--card); border: 1px solid #333; margin-bottom: 10px; border-radius: 8px; overflow: hidden; }
        summary { padding: 15px; cursor: pointer; background: #222; display: flex; justify-content: space-between; align-items: center; }
        summary:hover { background: #2a2a2a; }
        
        .user-details { padding: 15px; border-top: 1px solid #333; }
        .site-row { display: grid; grid-template-columns: 1fr 2fr 1fr 1fr auto; gap: 10px; padding: 10px; background: #111; margin-top: 5px; align-items: center; border-radius: 4px; }
        
        .status-verified { color: var(--success); }
        .status-pending { color: orange; }
        .status-suspended { color: var(--danger); }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div style="text-align: center;">
            <h2 style="color: var(--accent);">ADMIN ACCESS</h2>
            <input type="password" id="adminKey" placeholder="Enter Admin Secret">
            <button onclick="loadAdmin()">Login</button>
        </div>
    </div>

    <h1>⚡ WebSutra Super Admin</h1>
    <div id="content">Loading...</div>

    <script>
        let SECRET = '';

        async function loadAdmin() {
            const keyInput = document.getElementById('adminKey').value;
            if(!keyInput) return alert("Enter key");
            SECRET = keyInput;

            try {
                const res = await api('list_all');
                if(!res.success) throw new Error("Invalid Key");
                
                document.getElementById('loginOverlay').style.display = 'none';
                render(res.data);
            } catch(e) {
                alert("Auth Failed");
            }
        }

        async function api(action, payload = {}) {
            const res = await fetch('/api/admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: SECRET, action, ...payload })
            });
            return await res.json();
        }

        function render(users) {
            const container = document.getElementById('content');
            container.innerHTML = users.map(user => `
                <details class="user-card">
                    <summary>
                        <span>
                            <strong>ID: ${user.id}</strong> | ${user.email || 'No Email'} 
                            <span style="opacity:0.6">(${user.sites.length}/${user.max_sites} sites)</span>
                        </span>
                        <span>Key: ${user.secret_key.substring(0,6)}...</span>
                    </summary>
                    
                    <div class="user-details">
                        <div style="margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px;">
                            <h4>User Settings</h4>
                            Email: <input id="email-${user.id}" value="${user.email || ''}">
                            Limit: <input id="limit-${user.id}" type="number" value="${user.max_sites}" style="width: 50px">
                            <button class="btn-save" onclick="saveUser(${user.id})">Save User</button>
                            <button class="btn-del" onclick="deleteUser(${user.id})">Delete User</button>
                        </div>

                        <h4>Sites</h4>
                        ${user.sites.map(site => `
                            <div class="site-row">
                                <input id="slug-${site.id}" value="${site.slug}">
                                <input id="url-${site.id}" value="${site.url}">
                                <select id="status-${site.id}" class="status-${site.status}">
                                    <option value="pending" ${site.status==='pending'?'selected':''}>Pending</option>
                                    <option value="verified" ${site.status==='verified'?'selected':''}>Verified</option>
                                    <option value="suspended" ${site.status==='suspended'?'selected':''}>Suspended</option>
                                </select>
                                <button class="btn-save" onclick="saveSite(${site.id})">💾</button>
                                <button class="btn-del" onclick="deleteSite(${site.id})">🗑️</button>
                            </div>
                        `).join('')}
                        ${user.sites.length === 0 ? '<div style="opacity:0.5">No sites added.</div>' : ''}
                    </div>
                </details>
            `).join('');
        }

        async function saveUser(id) {
            await api('update_user', {
                userId: id,
                data: {
                    email: document.getElementById(`email-${id}`).value,
                    max_sites: document.getElementById(`limit-${id}`).value
                }
            });
            alert("User Updated");
        }

        async function deleteUser(id) {
            if(!confirm("Delete user and ALL their sites?")) return;
            await api('delete_user', { userId: id });
            loadAdmin(); // Reload list
        }

        async function saveSite(id) {
            await api('update_site', {
                siteId: id,
                data: {
                    title: "Updated via Admin", // simplified
                    slug: document.getElementById(`slug-${id}`).value,
                    url: document.getElementById(`url-${id}`).value,
                    status: document.getElementById(`status-${id}`).value
                }
            });
            alert("Site Updated");
        }

        async function deleteSite(id) {
            if(!confirm("Delete this site?")) return;
            await api('delete_site', { siteId: id });
            loadAdmin();
        }
    </script>
</body>
</html>
