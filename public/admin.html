<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSutra High Wizard Citadel ⚡ | Super Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .user-card { margin-bottom: 16px; }
        summary { 
            cursor: pointer; 
            background: linear-gradient(180deg, #3d2716 0%, #1a0e06 100%); 
            color: var(--rpg-gold-light); 
            padding: 12px 18px; 
            font-family: var(--font-fantasy); 
            font-size: 18px; 
            font-weight: bold; 
            border: 2px solid var(--rpg-gold); 
            border-radius: 6px; 
            user-select: none; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        summary:hover { background: linear-gradient(180deg, #5c3b22 0%, #2e1a0b 100%); color: #fff; }
        .user-details { background: var(--rpg-wood-dark); color: var(--text-main); padding: 20px; border: 2px solid var(--rpg-gold); border-top: none; border-radius: 0 0 6px 6px; box-shadow: inset 0 0 12px rgba(0,0,0,0.6); }
        .site-row { 
            display: grid; 
            grid-template-columns: 1.2fr 1fr 1.5fr 1fr 1.2fr auto auto; 
            gap: 8px; 
            padding: 10px; 
            background: #24170c; 
            margin-top: 8px; 
            align-items: center; 
            border: 1px solid var(--rpg-wood-border); 
            border-radius: 4px;
        }
        .site-row input, .site-row select { font-size: 12px; padding: 5px; }
        .reset-link-box { display: none; margin-top: 14px; padding: 14px; background: #0e0804; color: var(--rpg-gold-light); border: 2px solid var(--rpg-gold); border-radius: 4px; }
        #loginOverlay { position: fixed; inset: 0; background: rgba(8, 5, 3, 0.92); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 100; }
    </style>
</head>
<body>

    <!-- ADMIN LOGIN OVERLAY -->
    <div id="loginOverlay">
        <fieldset class="retro-box" style="width: 420px; text-align: center;">
            <div class="card-header">
                <h2>⚡ High Wizard Citadel</h2>
            </div>
            <h2 style="font-family: var(--font-fantasy); font-size: 24px; color: var(--rpg-gold-light); margin-top: 0;">ADMINISTRATOR AUTH</h2>
            <div style="margin-bottom: 20px;">
                <input type="password" id="adminKey" placeholder="Enter High Wizard Password">
            </div>
            <button onclick="loadAdmin()" class="btn btn-saffron" style="width: 100%; padding: 12px; font-size: 14px;">
                🔑 Unlock Citadel Controls
            </button>
        </fieldset>
    </div>

    <div id="container">
        
        <header class="hero-header">
            <div class="header-top-nav">
                <div>
                    <span style="font-size: 24px;">👑</span>
                    <span style="font-family: var(--font-fantasy); font-size: 18px; color: var(--rpg-gold-light); font-weight: bold; margin-left: 8px;">ADMIN_CONSOLE.SYS</span>
                </div>
                <div>
                    <a href="/" class="btn">🏠 World Map</a>
                </div>
            </div>

            <div class="hero-title-group">
                <h1>⚡ High Wizard Citadel</h1>
                <div class="hero-subtitle">Manage webmaster charters, realm statuses, and rune reset tokens</div>
            </div>
        </header>

        <div class="retro-divider">
            <img src="graphics/divider-blood.gif" alt="--- divider ---">
        </div>

        <fieldset class="retro-box">
            <div class="card-header">
                <h2>👥 ALL GUILD WEBMSTERS LEDGER</h2>
            </div>
            <div id="content">Consulting database archives...</div>
        </fieldset>

        <footer class="retro-box" style="text-align: center;">
            <a href="/" class="btn">&larr; Return to World Map</a>
        </footer>

    </div> <!-- END CONTAINER -->

    <script>
        const INDIAN_STATES = [
            "Andaman and Nicobar Islands", "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar",
            "Chandigarh", "Chhattisgarh", "Dadra and Nagar Haveli and Daman and Diu", "Delhi", "Goa",
            "Gujarat", "Haryana", "Himachal Pradesh", "Jammu and Kashmir", "Jharkhand", "Karnataka",
            "Kerala", "Ladakh", "Lakshadweep", "Madhya Pradesh", "Maharashtra", "Manipur", "Meghalaya",
            "Mizoram", "Nagaland", "Odisha", "Puducherry", "Punjab", "Rajasthan", "Sikkim", "Tamil Nadu",
            "Telangana", "Tripura", "Uttar Pradesh", "Uttarakhand", "West Bengal"
        ];

        let SECRET = '';

        async function loadAdmin() {
            const keyInput = document.getElementById('adminKey').value.trim();
            if(!keyInput) return alert("Enter key");
            SECRET = keyInput;

            try {
                const res = await api('list_all');
                if(!res.success) throw new Error(res.error || "Invalid Key");
                
                document.getElementById('loginOverlay').style.display = 'none';
                render(res.data);
            } catch(e) {
                alert(`Auth Failed: ${e.message}`);
            }
        }

        async function api(action, payload = {}) {
            try {
                const res = await fetch('/api/admin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: SECRET, action, ...payload })
                });
                const text = await res.text();
                try {
                    return JSON.parse(text);
                } catch (parseErr) {
                    return { success: false, error: `Server returned ${res.status} HTML/Text: ${text.slice(0, 120)}` };
                }
            } catch (e) {
                return { success: false, error: `Network Error: ${e.message}` };
            }
        }

        function render(users) {
            const container = document.getElementById('content');
            container.innerHTML = users.map(user => `
                <details class="user-card">
                    <summary>
                        <span>
                            🛡️ ID: ${user.id} | ${user.email || 'No Raven Address Registered'} 
                            <span style="font-size: 14px; opacity: 0.85; margin-left: 8px;">(${user.sites.length}/${user.max_sites} realms)</span>
                        </span>
                        <span style="font-size: 12px; color: var(--rpg-gold);">SECRET PROTECTED</span>
                    </summary>
                    
                    <div class="user-details">
                        <div style="margin-bottom: 20px; border-bottom: 1px dashed var(--rpg-gold-dark); padding-bottom: 16px;">
                            <h4 style="font-family: var(--font-fantasy); font-size: 20px; margin-top: 0; color: var(--rpg-gold-light);">Webmaster Settings</h4>
                            <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                                <div>
                                    Email: <input id="email-${user.id}" value="${user.email || ''}" style="width: 220px;">
                                </div>
                                <div>
                                    Max Sites: <input id="limit-${user.id}" type="number" value="${user.max_sites}" style="width: 70px;">
                                </div>
                                <button class="btn btn-saffron" onclick="saveUser(${user.id})">💾 Save</button>
                                <button class="btn" onclick="createResetLink(${user.id})">🔑 Secret Reset Link</button>
                                <button class="btn btn-pink" onclick="deleteUser(${user.id})">🗑️ Delete</button>
                            </div>
                            
                            <div class="reset-link-box" id="reset-link-box-${user.id}">
                                <strong>One-Time Secret Reset Rune Link:</strong>
                                <input id="reset-link-${user.id}" readonly style="margin-top: 6px;">
                                <button class="btn btn-saffron" style="margin-top: 8px;" onclick="copyResetLink(${user.id})">Copy Link</button>
                                <small id="reset-link-expiry-${user.id}" style="display: block; margin-top: 6px; color: var(--rpg-gold-light);"></small>
                            </div>
                        </div>

                        <h4 style="font-family: var(--font-fantasy); font-size: 20px; color: var(--rpg-gold-light); margin-bottom: 10px;">Associated Realm Charters</h4>
                        <div class="site-row" style="background: linear-gradient(180deg, #3d2716 0%, #1a0e06 100%); color: var(--rpg-gold-light); font-weight: bold; font-family: var(--font-pixel); font-size: 11px;">
                            <span>Title</span>
                            <span>Slug (ID)</span>
                            <span>URL</span>
                            <span>Status</span>
                            <span>State / Realm</span>
                            <span>Save</span>
                            <span>Del</span>
                        </div>

                        ${user.sites.map(site => {
                            const stateOpts = '<option value="">-- None --</option>' + INDIAN_STATES.map(s =>
                                `<option value="${s}" ${site.state === s ? 'selected' : ''}>${s}</option>`
                            ).join('');

                            return `
                            <div class="site-row">
                                <input id="title-${site.id}" value="${site.title}" placeholder="Site Title">
                                <input id="slug-${site.id}" value="${site.slug}" placeholder="Slug">
                                <input id="url-${site.id}" value="${site.url}" placeholder="URL">
                                
                                <select id="status-${site.id}">
                                    <option value="pending" ${site.status==='pending'?'selected':''}>Pending</option>
                                    <option value="verified" ${site.status==='verified'?'selected':''}>Verified</option>
                                    <option value="suspended" ${site.status==='suspended'?'selected':''}>Suspended</option>
                                </select>

                                <select id="state-${site.id}">
                                    ${stateOpts}
                                </select>
                                
                                <button class="btn btn-saffron" onclick="saveSite(${site.id})">💾</button>
                                <button class="btn btn-pink" onclick="deleteSite(${site.id})">🗑️</button>
                            </div>
                        `}).join('')}
                        ${user.sites.length === 0 ? '<div style="opacity:0.8; padding:12px;">No charters registered for this webmaster.</div>' : ''}
                    </div>
                </details>
            `).join('');
        }

        async function saveUser(id) {
            await api('update_user', {
                userId: id,
                data: {
                    email: document.getElementById(`email-${id}`).value,
                    max_sites: document.getElementById(`limit-${id}`).value
                }
            });
            alert("Webmaster Settings Updated");
        }

        async function createResetLink(id) {
            const res = await api('create_secret_reset_link', { userId: id });
            if(!res.success) return alert(res.error || "Could not create reset link");

            const box = document.getElementById(`reset-link-box-${id}`);
            const input = document.getElementById(`reset-link-${id}`);
            const expiry = document.getElementById(`reset-link-expiry-${id}`);

            input.value = res.resetLink;
            expiry.textContent = `Expires: ${new Date(res.expiresAt).toLocaleString()}`;
            box.style.display = 'block';
            input.focus();
            input.select();
        }

        async function copyResetLink(id) {
            const input = document.getElementById(`reset-link-${id}`);
            input.focus();
            input.select();

            try {
                await navigator.clipboard.writeText(input.value);
                alert("Reset link copied");
            } catch(e) {
                document.execCommand('copy');
                alert("Reset link copied");
            }
        }

        async function deleteUser(id) {
            if(!confirm("Delete webmaster and ALL their charters?")) return;
            await api('delete_user', { userId: id });
            loadAdmin();
        }

        async function saveSite(id) {
            const titleInput = document.getElementById(`title-${id}`).value;
            
            await api('update_site', {
                siteId: id,
                data: {
                    title: titleInput,
                    slug: document.getElementById(`slug-${id}`).value,
                    url: document.getElementById(`url-${id}`).value,
                    status: document.getElementById(`status-${id}`).value,
                    state: document.getElementById(`state-${id}`).value
                }
            });
            alert("Site Charter Updated");
        }

        async function deleteSite(id) {
            if(!confirm("Delete this site charter?")) return;
            await api('delete_site', { siteId: id });
            loadAdmin();
        }
    </script>
</body>
</html>
