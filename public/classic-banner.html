<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebSutra Responsive Banner</title>
<style>
    /* 1. RESET: Force no scrolling on the document level */
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* CRITICAL: Kills scrollbars */
        background-color: transparent;
        font-family: sans-serif;
    }

    * {
        box-sizing: border-box; /* Ensures padding/borders don't expand width */
    }

    /* Link Wrapper */
    .banner-link {
        text-decoration: none;
        display: block;
        width: 100%;
        height: 100%;
    }

    .banner-classic {
        background-color: #ffff00; /* Bright Yellow */
        border: 5px ridge #0000ff; /* Blue Ridge Border */
        
        /* Layout */
        display: flex;
        flex-wrap: wrap; /* Allows wrapping */
        align-items: center;
        justify-content: space-between;
        align-content: center; /* Vertically center content */
        
        padding: 4px 8px;
        width: 100%;
        height: 100%; /* Fill the iframe */
    }

    /* Text Styles */
    .banner-classic h2 {
        font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
        color: #ff0000;
        margin: 0;
        font-size: 22px; /* Slightly smaller to be safe */
        text-shadow: 2px 2px #00ff00;
        line-height: 1;
        white-space: nowrap;
        flex-shrink: 0; 
    }

    /* Marquee Box */
    .marquee-container {
        overflow: hidden;
        white-space: nowrap;
        background: white;
        border: 2px inset #ccc;
        color: blue;
        font-weight: bold;
        font-size: 13px;
        font-family: Arial, sans-serif;
        height: 20px;
        line-height: 20px;
        position: relative;
        
        /* Flex magic: Grow to fill space, but don't get smaller than 100px */
        flex: 1 1 120px; 
        margin: 0 10px;
    }

    .scrolling {
        display: inline-block;
        padding-left: 100%;
        animation: scroll-left 6s linear infinite;
    }

    @keyframes scroll-left {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
    }

    /* Button Style */
    .click-btn {
        background: #cccccc;
        border: 2px outset #ffffff;
        font-size: 10px;
        color: black;
        font-weight: bold;
        text-align: center;
        padding: 3px 6px;
        font-family: Verdana, sans-serif;
        flex-shrink: 0;
        white-space: nowrap;
    }

    /* --- MOBILE BREAKPOINT --- */
    /* Triggers when iframe width is small (typical mobile portrait) */
    @media (max-width: 450px) {
        .banner-classic {
            padding: 6px;
            align-content: space-around; /* Space out rows */
        }

        /* Row 1: Logo and Button */
        .banner-classic h2 {
            order: 1;
            font-size: 20px;
        }
        
        .click-btn {
            order: 2;
        }

        /* Row 2: Marquee drops down */
        .marquee-container {
            order: 3;
            flex: 1 1 100%; /* Force full width */
            margin: 6px 0 0 0; /* Add top margin */
            width: 100%;
        }
    }
</style>
</head>
<body>

    <!-- LINK: Change href="#" to your actual Join URL -->
    <a href="https://webring.blackpiratex.com" target="_blank" class="banner-link">
        <div class="banner-classic">
            <!-- Logo -->
            <div class="amateur-font">
                <h2>WebSutra</h2>
            </div>
            
            <!-- Marquee -->
            <div class="marquee-container">
                <div class="scrolling">★ JOIN TODAY!!! ★ DESI LINKS ★ FREE TRAFFIC ★</div>
            </div>
            
            <!-- Button -->
            <div class="click-btn">
                CLICK<br>HERE
            </div>
        </div>
    </a>

</body>
</html>
