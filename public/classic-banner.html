<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebSutra Responsive Banner</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: transparent;
    }

    /* Link Wrapper */
    .banner-link {
        text-decoration: none;
        display: block;
        width: 100%;
        max-width: 468px; /* Stops it from getting too big on desktop */
        margin: 0 auto;   /* Centers it if iframe is wider */
    }

    .banner-classic {
        background-color: #ffff00; /* Bright Yellow */
        border: 5px ridge #0000ff; /* Blue Ridge Border */
        
        /* Flexbox Layout */
        display: flex;
        flex-wrap: wrap; /* Allows items to drop to next line */
        align-items: center;
        justify-content: space-between;
        
        padding: 5px 10px;
        box-sizing: border-box;
        cursor: pointer;
        
        /* Minimum height for desktop feel, but allows growth */
        min-height: 60px; 
    }

    /* Text Styles */
    .banner-classic h2 {
        font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
        color: #ff0000;
        margin: 0;
        font-size: 24px;
        text-shadow: 2px 2px #00ff00;
        line-height: 1;
        /* Flex: Do not shrink */
        flex-shrink: 0; 
    }

    /* Marquee Box */
    .marquee-container {
        overflow: hidden;
        white-space: nowrap;
        background: white;
        border: 2px inset #ccc;
        color: blue;
        font-weight: bold;
        font-size: 14px;
        font-family: Arial, sans-serif;
        height: 20px;
        line-height: 20px;
        
        /* Desktop: Fixed width */
        width: 180px; 
    }

    .scrolling {
        display: inline-block;
        padding-left: 100%;
        animation: scroll-left 6s linear infinite;
    }

    @keyframes scroll-left {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
    }

    /* Button Style */
    .click-btn {
        background: #cccccc;
        border: 2px outset #ffffff;
        font-size: 10px;
        color: black;
        font-weight: bold;
        text-align: center;
        padding: 2px 5px;
        font-family: Verdana, sans-serif;
        flex-shrink: 0;
    }
    
    .banner-classic:hover .click-btn {
        background-color: #e0e0e0;
    }

    /* --- RESPONSIVE MAGIC --- */
    /* When width is less than approx 400px */
    @media (max-width: 420px) {
        .banner-classic {
            justify-content: space-between;
            padding: 8px;
        }

        /* Order: Logo(1), Button(2), Marquee(3) */
        .banner-classic h2 {
            order: 1;
            font-size: 20px; /* Slightly smaller text */
        }
        
        .click-btn {
            order: 2;
        }

        .marquee-container {
            order: 3;
            width: 100%;      /* Full width on mobile */
            margin-top: 8px;  /* Space between rows */
        }
    }
</style>
</head>
<body>

    <!-- LINK: Change href="#" to your actual Join URL -->
    <a href="https://webring.blackpiratex.com" target="_blank" class="banner-link">
        <div class="banner-classic">
            <!-- Logo -->
            <div class="amateur-font">
                <h2>WebSutra</h2>
            </div>
            
            <!-- Marquee -->
            <div class="marquee-container">
                <div class="scrolling">★ JOIN TODAY!!! ★ DESI LINKS ★ FREE TRAFFIC ★</div>
            </div>
            
            <!-- Button -->
            <div class="click-btn">
                CLICK<br>HERE
            </div>
        </div>
    </a>

</body>
</html>
