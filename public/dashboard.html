<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSutra Dashboard</title>
    <style>
        :root { --bg: #0a0a0a; --card: #161616; --input: #222; --border: #333; --text: #e0e0e0; --accent: #ff8c42; --danger: #ff4444; --success: #00C851; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); max-width: 900px; margin: 0 auto; padding: 2rem; line-height: 1.5; }
        
        /* Typography */
        h1, h2, h3 { margin-top: 0; color: #fff; }
        h1 { color: var(--accent); }
        a { color: #888; text-decoration: none; }
        a:hover { color: var(--accent); }

        /* Forms */
        label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 5px; margin-top: 15px; font-weight: 600; }
        input { width: 100%; padding: 12px; background: var(--input); border: 1px solid var(--border); color: white; border-radius: 6px; box-sizing: border-box; font-family: monospace; }
        input:focus { outline: none; border-color: var(--accent); }

        /* Buttons */
        button { padding: 8px 16px; cursor: pointer; border: none; border-radius: 6px; font-weight: 600; transition: opacity 0.2s; font-size: 0.9rem; }
        button:hover { opacity: 0.9; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-secondary { background: #333; color: #fff; }
        .btn-danger { background: rgba(255, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-block { width: 100%; }

        /* Layout Utilities */
        .hidden { display: none !important; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; margin-bottom: 25px; }
        .flex { display: flex; gap: 10px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }

        /* Badges */
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; text-transform: uppercase; font-weight: bold; }
        .badge-pending { background: #332b00; color: #ffbb33; border: 1px solid #ffbb33; }
        .badge-verified { background: #002200; color: #00C851; border: 1px solid #00C851; }
        
        /* Code Block */
        .code-area { background: #000; padding: 15px; border-radius: 6px; border: 1px solid #333; margin-top: 10px; margin-bottom: 15px; }
        .code-area pre { margin: 0; white-space: pre-wrap; word-break: break-all; color: #aaffaa; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 40px;">
        <h1>WebSutra Dashboard</h1>
        <a href="/" onclick="logout()">Logout / Home</a>
    </header>

    <div id="loginSection" style="max-width: 400px; margin: 0 auto;">
        <div class="card">
            <h2 style="margin-bottom: 20px;">Member Login</h2>
            <label>Secret Key</label>
            <input type="password" id="loginKey" placeholder="Paste your key here...">
            <button onclick="login()" class="btn-primary btn-block" style="margin-top: 20px;">Access Dashboard</button>
            <p style="font-size: 0.8rem; color: #666; text-align: center; margin-top: 15px;">Use the key you received during signup.</p>
        </div>
    </div>

    <div id="mainInterface" class="hidden">
        
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin:0">Profile Settings</h3>
                <span style="font-size: 0.9rem; color: #888;">Usage: <strong id="siteCount" style="color:#fff">0</strong> / <span id="maxSites">2</span> sites</span>
            </div>
            <div class="flex">
                <div style="flex-grow: 1;">
                    <label style="margin-top:0">Registered Email</label>
                    <input type="email" id="userEmail">
                </div>
                <button onclick="saveProfile()" class="btn-secondary" style="align-self: flex-end;">Update Email</button>
            </div>
        </div>

        <div id="sitesContainer"></div>

        <div id="addSiteCard" class="card hidden">
            <h3>+ Add New Site</h3>
            <label>Site Title</label>
            <input type="text" id="newTitle" placeholder="My Awesome Blog">
            
            <div class="grid">
                <div>
                    <label>URL</label>
                    <input type="url" id="newUrl" placeholder="https://...">
                </div>
                <div>
                    <label>Unique Slug (ID)</label>
                    <input type="text" id="newSlug" placeholder="my-blog">
                </div>
            </div>
            
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button onclick="addSite()" class="btn-primary">Create Site</button>
                <button onclick="toggleAddForm()" class="btn-secondary">Cancel</button>
            </div>
        </div>

        <button id="showAddBtn" onclick="toggleAddForm()" class="btn-secondary btn-block" style="padding: 15px; border: 1px dashed #444;">
            + Add Another Site
        </button>

    </div>

    <script>
        let sessionKey = localStorage.getItem('websutra_key') || '';
        let currentUser = null;

        if(sessionKey) {
            document.getElementById('loginKey').value = sessionKey;
            login();
        }

        async function api(endpoint, data) {
            if(endpoint.includes('manage')) data.key = sessionKey;
            try {
                const req = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                return await req.json();
            } catch(e) { return { error: "Network Error" }; }
        }

        async function login() {
            const keyInput = document.getElementById('loginKey').value.trim();
            if(!keyInput) return alert("Please enter your key");
            
            const data = await api('/api/manage', { action: 'login', key: keyInput });

            if(data.success) {
                sessionKey = keyInput;
                localStorage.setItem('websutra_key', sessionKey);
                currentUser = data.user;
                renderDashboard(data.user, data.sites);
            } else {
                alert(data.error);
                localStorage.removeItem('websutra_key');
            }
        }

        function logout() {
            localStorage.removeItem('websutra_key');
            location.href = '/';
        }

        // --- VERIFICATION LOGIC ---
        async function verifySite(slug, btnId) {
            const btn = document.getElementById(btnId);
            const originalText = btn.textContent;
            btn.textContent = "Scanning...";
            btn.disabled = true;

            const res = await api('/api/verify', { slug: slug });

            if (res.success) {
                btn.className = "btn-success";
                btn.textContent = "✓ Success";
                setTimeout(() => login(), 1000); // Reload dashboard
            } else {
                alert(res.error);
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        async function saveProfile() {
            const newEmail = document.getElementById('userEmail').value;
            const res = await api('/api/manage', { action: 'update_profile', newEmail });
            if(res.success) alert("Email updated."); else alert(res.error);
        }

        async function saveSite(id) {
            const res = await api('/api/manage', {
                action: 'update_site',
                siteId: id,
                newTitle: document.getElementById(`title-${id}`).value,
                newUrl: document.getElementById(`url-${id}`).value,
                newSlug: document.getElementById(`slug-${id}`).value
            });
            if(res.success) alert("Site details updated."); else alert(res.error);
        }

        async function deleteSite(id) {
            if(!confirm("Permanently delete this site?")) return;
            const res = await api('/api/manage', { action: 'delete_site', siteId: id });
            if(res.success) login(); else alert(res.error);
        }

        async function addSite() {
            const res = await api('/api/manage', {
                action: 'add_site',
                newTitle: document.getElementById('newTitle').value,
                newUrl: document.getElementById('newUrl').value,
                newSlug: document.getElementById('newSlug').value
            });
            if(res.success) {
                toggleAddForm();
                login(); 
            } else {
                alert(res.error);
            }
        }

        function toggleAddForm() {
            const form = document.getElementById('addSiteCard');
            const btn = document.getElementById('showAddBtn');
            const isHidden = form.classList.contains('hidden');
            
            if(isHidden) {
                form.classList.remove('hidden');
                btn.classList.add('hidden');
            } else {
                form.classList.add('hidden');
                btn.classList.remove('hidden');
            }
        }

        function renderDashboard(user, sites) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainInterface').classList.remove('hidden');

            document.getElementById('userEmail').value = user.email || "";
            document.getElementById('siteCount').textContent = sites.length;
            document.getElementById('maxSites').textContent = user.max_sites;

            if(sites.length >= user.max_sites) {
                document.getElementById('showAddBtn').style.display = 'none';
                document.getElementById('addSiteCard').classList.add('hidden');
            } else {
                document.getElementById('showAddBtn').style.display = 'block';
            }

            const container = document.getElementById('sitesContainer');
            if(sites.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 40px; color:#666;">No sites found. Add one below!</div>';
                return;
            }

            // Hardcoded host for the snippet
            const host = "https://webring.blackpiratex.com"; 

            container.innerHTML = sites.map(site => {
                const snippet = `
<div id="websutra-ring">
  <p>Member of <a href="${host}">WebSutra</a></p>
  <a href="${host}/api/ring?action=prev&slug=${site.slug}">← Prev</a>
  <a href="${host}/api/ring?action=random">Random</a>
  <a href="${host}/api/ring?action=next&slug=${site.slug}">Next →</a>
</div>`.trim().replace(/</g, "&lt;").replace(/>/g, "&gt;");

                const badgeClass = site.status === 'verified' ? 'badge-verified' : 'badge-pending';

                return `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px;">
                        <h3 style="margin:0">${site.title}</h3>
                        <span class="badge ${badgeClass}">${site.status}</span>
                    </div>

                    <div class="grid">
                        <div>
                            <label>Site Title</label>
                            <input type="text" id="title-${site.id}" value="${site.title}">
                            <label>URL</label>
                            <input type="url" id="url-${site.id}" value="${site.url}">
                            <label>Slug (ID)</label>
                            <input type="text" id="slug-${site.id}" value="${site.slug}">
                            
                            <div style="display:flex; gap:10px; margin-top:20px;">
                                <button onclick="saveSite(${site.id})" class="btn-primary" style="flex:1">Save Changes</button>
                                <button onclick="deleteSite(${site.id})" class="btn-danger">Delete</button>
                            </div>
                        </div>

                        <div style="background: #111; padding: 15px; border-radius: 8px; border: 1px solid #333;">
                            <h4 style="margin-top:0; color:#fff;">Code & Status</h4>
                            <p style="font-size:0.85rem; color:#888; margin-bottom: 5px;">Paste into your site footer:</p>
                            
                            <div class="code-area"><pre>${snippet}</pre></div>

                            <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #333; padding-top: 15px;">
                                <div>
                                    <span style="font-size: 0.85rem; color: #888;">Current Status:</span>
                                    <span class="badge ${badgeClass}" style="margin-left: 5px;">${site.status}</span>
                                </div>
                                
                                ${site.status === 'pending' 
                                    ? `<button id="verify-btn-${site.id}" onclick="verifySite('${site.slug}', 'verify-btn-${site.id}')" class="btn-secondary">Verify Now</button>`
                                    : `<span style="color: #00C851; font-size: 1.2rem;">✓</span>`
                                }
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }
    </script>
</body>
</html>
