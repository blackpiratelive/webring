<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSutra Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="main">
    <header>
        <h1>WebSutra Dashboard</h1>
        <a href="/" onclick="logout(); return false;">Logout / Home</a>
    </header>

    <hr>

    <div id="loginSection">
        <h2>Member Login</h2>
        <label for="loginKey">Secret Key:</label>
        <input type="password" id="loginKey" placeholder="Paste your key here...">
        <br><br>
        <button onclick="login()">Access Dashboard</button>
        <p><small>Use the key you received during signup.</small></p>
    </div>

    <div id="mainInterface" style="display: none;">
        
        <div>
            <h3>Profile Settings</h3>
            <p>Usage: <strong id="siteCount">0</strong> / <span id="maxSites">2</span> sites</p>
            
            <label for="userEmail">Registered Email:</label>
            <input type="email" id="userEmail">
            <button onclick="saveProfile()">Update Email</button>
        </div>

        <hr>

        <h3>Your Sites</h3>
        <div id="sitesContainer"></div>

        <hr>

        <button id="showAddBtn" onclick="toggleAddForm()">+ Add Another Site</button>

        <div id="addSiteCard" style="display: none; border: 1px solid #ccc; padding: 10px; margin-top: 10px;">
            <h3>Add New Site</h3>
            
            <label>Site Title:</label><br>
            <input type="text" id="newTitle" placeholder="My Awesome Blog"><br><br>
            
            <label>URL:</label><br>
            <input type="url" id="newUrl" placeholder="https://..."><br><br>
            
            <label>Unique Slug (ID):</label><br>
            <input type="text" id="newSlug" placeholder="my-blog"><br><br>
            
            <button onclick="addSite()">Create Site</button>
            <button onclick="toggleAddForm()">Cancel</button>
        </div>

    </div>
</div>
    <script>
        let sessionKey = localStorage.getItem('websutra_key') || '';
        let currentUser = null;

        // Auto-fill and login if key exists
        if(sessionKey) {
            document.getElementById('loginKey').value = sessionKey;
            login();
        }

        async function api(endpoint, data) {
            // Attach sessionKey if not present
            if(endpoint.includes('manage') && !data.key) {
                data.key = sessionKey;
            }
            
            try {
                const req = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                return await req.json();
            } catch(e) { return { error: "Network Error" }; }
        }

        async function login() {
            const keyInput = document.getElementById('loginKey').value.trim();
            if(!keyInput) return alert("Please enter your key");
            
            const data = await api('/api/manage', { action: 'login', key: keyInput });

            if(data.success) {
                sessionKey = keyInput;
                localStorage.setItem('websutra_key', sessionKey);
                currentUser = data.user;
                renderDashboard(data.user, data.sites);
            } else {
                alert(data.error || "Login failed");
                localStorage.removeItem('websutra_key');
            }
        }

        function logout() {
            localStorage.removeItem('websutra_key');
            location.href = '/';
        }

        // --- VERIFICATION LOGIC ---
        async function verifySite(slug, btnId) {
            const btn = document.getElementById(btnId);
            const originalText = btn.textContent;
            btn.textContent = "Scanning...";
            btn.disabled = true;

            const res = await api('/api/verify', { slug: slug });

            if (res.success) {
                btn.textContent = "✓ Success";
                setTimeout(() => login(), 1000); 
            } else {
                alert(res.error);
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        async function saveProfile() {
            const newEmail = document.getElementById('userEmail').value;
            const res = await api('/api/manage', { action: 'update_profile', newEmail });
            if(res.success) alert("Email updated."); else alert(res.error);
        }

        async function saveSite(id) {
            const res = await api('/api/manage', {
                action: 'update_site',
                siteId: id,
                newTitle: document.getElementById(`title-${id}`).value,
                newUrl: document.getElementById(`url-${id}`).value,
                newSlug: document.getElementById(`slug-${id}`).value
            });
            if(res.success) alert("Site details updated."); else alert(res.error);
        }

        async function deleteSite(id) {
            if(!confirm("Permanently delete this site?")) return;
            const res = await api('/api/manage', { action: 'delete_site', siteId: id });
            if(res.success) login(); else alert(res.error);
        }

        async function addSite() {
            const res = await api('/api/manage', {
                action: 'add_site',
                newTitle: document.getElementById('newTitle').value,
                newUrl: document.getElementById('newUrl').value,
                newSlug: document.getElementById('newSlug').value
            });
            if(res.success) {
                toggleAddForm();
                login(); 
            } else {
                alert(res.error);
            }
        }

        function toggleAddForm() {
            const form = document.getElementById('addSiteCard');
            const btn = document.getElementById('showAddBtn');
            
            // Toggle visibility using inline styles since we have no CSS classes
            if (form.style.display === 'none') {
                form.style.display = 'block';
                btn.style.display = 'none';
            } else {
                form.style.display = 'none';
                btn.style.display = 'block';
            }
        }

        function renderDashboard(user, sites) {
            // Switch views using inline styles
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('mainInterface').style.display = 'block';

            document.getElementById('userEmail').value = user.email || "";
            document.getElementById('siteCount').textContent = sites.length;
            document.getElementById('maxSites').textContent = user.max_sites;

            if(sites.length >= user.max_sites) {
                document.getElementById('showAddBtn').style.display = 'none';
                document.getElementById('addSiteCard').style.display = 'none';
            } else {
                document.getElementById('showAddBtn').style.display = 'block';
            }

            const container = document.getElementById('sitesContainer');
            if(sites.length === 0) {
                container.innerHTML = '<p>No sites found. Add one below!</p>';
                return;
            }

            const host = "https://webring.blackpiratex.com"; 

            container.innerHTML = sites.map(site => {
                const snippet = `
<div id="websutra-ring">
  <p>Member of <a href="${host}">WebSutra</a></p>
  <a href="${host}/api/ring?action=prev&slug=${site.slug}">← Prev</a>
  <a href="${host}/api/ring?action=random">Random</a>
  <a href="${host}/api/ring?action=next&slug=${site.slug}">Next →</a>
</div>`.trim().replace(/</g, "&lt;").replace(/>/g, "&gt;");

                return `
                <div style="border: 1px solid #ccc; padding: 15px; margin-bottom: 20px;">
                    <h4 style="margin: 0;">${site.title} (Status: ${site.status.toUpperCase()})</h4>
                    <br>
                    
                    <label>Title:</label> <input type="text" id="title-${site.id}" value="${site.title}"><br><br>
                    <label>URL:</label> <input type="url" id="url-${site.id}" value="${site.url}"><br><br>
                    <label>Slug:</label> <input type="text" id="slug-${site.id}" value="${site.slug}"><br><br>
                    
                    <button onclick="saveSite(${site.id})">Save Changes</button>
                    <button onclick="deleteSite(${site.id})">Delete Site</button>
                    
                    <hr>
                    
                    <p><strong>Integration Code:</strong></p>
                    <textarea rows="5" cols="50" readonly>${snippet}</textarea>
                    
                    <p>
                        Current Status: <strong>${site.status}</strong> 
                        ${site.status === 'pending' 
                            ? `<button id="verify-btn-${site.id}" onclick="verifySite('${site.slug}', 'verify-btn-${site.id}')">Verify Now</button>`
                            : `(Verified)`
                        }
                    </p>
                </div>`;
            }).join('');
        }
    </script>
</body>
</html>
