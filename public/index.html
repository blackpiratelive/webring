<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSutra: The Indian Small Web</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --accent: #ff8c42; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); max-width: 700px; margin: 0 auto; padding: 2rem; line-height: 1.5; }
        h1, h2 { color: var(--accent); margin-top: 2rem; }
        a { color: var(--accent); text-decoration: none; }
        /* Form Styling */
        form { display: grid; gap: 10px; background: var(--card); padding: 1.5rem; border-radius: 8px; border: 1px solid #333; }
        input, button { padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; }
        button { background: var(--accent); color: #121212; font-weight: bold; cursor: pointer; border: none; }
        button:hover { opacity: 0.9; }
        /* List Styling */
        #members { list-style: none; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .site { background: var(--card); padding: 10px; border: 1px solid #333; border-radius: 4px; font-size: 0.9rem; }
        .site small { display: block; opacity: 0.6; margin-top: 5px; }
        /* Code Box */
        #result { display: none; background: #000; padding: 1rem; border: 1px solid #444; margin-top: 1rem; overflow-x: auto; font-family: monospace; }
    </style>
</head>
<body>

    <header>
        <h1>WebSutra 🕸️</h1>
        <p>A webring for the Indian Small Web. No JavaScript widgets, no tracking. Just links connecting personal corners of the internet.</p>
    </header>

    <section>
        <h2>Join the Ring</h2>
        <form id="joinForm">
            <input type="text" id="title" placeholder="Site Name (e.g., Rohit's Notes)" required>
            <input type="url" id="url" placeholder="URL (e.g., https://rohit.me)" required>
            <input type="text" id="slug" placeholder="Unique ID (e.g., rohit-notes)" required>
            <input type="email" id="email" placeholder="Email (Private, for recovery only)" required>
            <button type="submit">Join & Get Code</button>
        </form>
        <div id="result"></div>
    </section>

    <section>
        <h2>Members</h2>
        <ul id="members">
            <li>Loading members...</li>
        </ul>
    </section>

    <script>
        // 1. Handle Signup
        document.getElementById('joinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = "Processing...";
            
            const payload = {
                title: document.getElementById('title').value,
                url: document.getElementById('url').value,
                slug: document.getElementById('slug').value,
                email: document.getElementById('email').value
            };

            try {
                const res = await fetch('/api/join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('result').style.display = 'block';
                    document.getElementById('result').textContent = data.snippet;
                    btn.textContent = "Success!";
                    loadMembers(); // Refresh list
                } else {
                    alert(data.error || "Error joining");
                    btn.textContent = originalText;
                }
            } catch (err) { alert("Server Error"); btn.textContent = originalText; }
        });

        // 2. Fetch Members List
        async function loadMembers() {
            try {
                const res = await fetch('/api/members');
                const sites = await res.json();
                const list = document.getElementById('members');
                list.innerHTML = sites.map(site => `
                    <li class="site">
                        <a href="${site.url}" target="_blank"><strong>${site.title}</strong></a>
                        <small>${site.url}</small>
                    </li>
                `).join('');
            } catch (e) {
                document.getElementById('members').innerHTML = "<li>Error loading members.</li>";
            }
        }
        
        loadMembers();
    </script>
</body>
</html>
