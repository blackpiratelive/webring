<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSutra: The Indian Small Web</title>
</head>
<body>

<div id="container">
    <a href="dashboard.html">Member Login</a>
    
    <header>
        <h1>WebSutra 🕸️</h1>
        <p>The Indian Small Web. Connected.</p>
    </header>

    <section id="join-section">
        <h2>Join the Ring</h2>
        <form id="joinForm">
            <label for="title">Site Name:</label><br>
            <input type="text" id="title" placeholder="e.g. Rohit's Garden" required>
            <br><br>

            <label for="url">URL:</label><br>
            <input type="url" id="url" placeholder="e.g. https://rohit.me" required>
            <br><br>

            <label for="slug">Unique ID:</label><br>
            <input type="text" id="slug" placeholder="e.g. rohit-notes" required pattern="[a-zA-Z0-9-]+">
            <small>(Letters, numbers, and hyphens only)</small>
            <br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" placeholder="Private, for recovery">
            <br><br>

            <button type="submit">Join & Get Code</button>
        </form>

        <div id="result"></div>
    </section>

    <hr>

    <section id="directory-section">
        <h2>Members Directory</h2>
        
        <div>
            Filter: 
            <label>
                <input type="radio" name="filter" value="verified" checked onchange="filterSites()">
                Verified
            </label>
            <label>
                <input type="radio" name="filter" value="pending" onchange="filterSites()">
                Pending
            </label>
            <label>
                <input type="radio" name="filter" value="all" onchange="filterSites()">
                All
            </label>
        </div>
        <br>

        <table border="1" cellpadding="10" cellspacing="0" id="members-table">
            <thead>
                <tr>
                    <th>Site Name</th>
                    <th>URL</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="members-body">
                <tr><td colspan="4">Loading directory...</td></tr>
            </tbody>
        </table>
    </section>

    <hr>

    <footer>
        <p>WebSutra is open source. <a href="dashboard.html">Manage your site</a></p>
        <p>Made by <a href="https://blackpiratex.com" target="_blank">BlackPiratex</a></p>
    </footer>
</div>

<script>
    let allSites = [];

    // 1. Fetch Members
    async function loadMembers() {
        const tableBody = document.getElementById('members-body');
        try {
            // Added timestamp to prevent caching
            const res = await fetch('/api/members?t=' + new Date().getTime());
            if (!res.ok) throw new Error("Failed");
            
            allSites = await res.json();
            
            if (allSites.length === 0) {
                tableBody.innerHTML = "<tr><td colspan='4'>No members yet.</td></tr>";
                return;
            }
            filterSites();

        } catch (e) {
            console.error(e);
            tableBody.innerHTML = "<tr><td colspan='4'>Error loading directory.</td></tr>";
        }
    }

    // 2. Filter Logic
    function filterSites() {
        const filterValue = document.querySelector('input[name="filter"]:checked').value;
        const tableBody = document.getElementById('members-body');
        
        const filteredSites = allSites.filter(site => {
            if (filterValue === 'all') return true;
            return site.status === filterValue;
        });

        if (filteredSites.length === 0) {
             tableBody.innerHTML = `<tr><td colspan='4'>No ${filterValue} sites found.</td></tr>`;
             return;
        }

        tableBody.innerHTML = filteredSites.map(site => {
            // Capitalize status for display
            const statusText = site.status.charAt(0).toUpperCase() + site.status.slice(1);
            
            return `
                <tr>
                    <td>${site.title}</td>
                    <td><a href="${site.url}" target="_blank">${site.url}</a></td>
                    <td>${statusText}</td>
                    <td><a href="${site.url}" target="_blank">Visit &rarr;</a></td>
                </tr>
            `;
        }).join('');
    }

    // 3. Signup Logic
    document.getElementById('joinForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const originalText = btn.textContent;
        btn.textContent = "Processing...";
        btn.disabled = true;
        
        const payload = {
            title: document.getElementById('title').value,
            url: document.getElementById('url').value,
            slug: document.getElementById('slug').value,
            email: document.getElementById('email').value
        };

        try {
            const res = await fetch('/api/join', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            
            if (data.success) {
                const resultDiv = document.getElementById('result');
                // Create a basic raw HTML display for the result
                resultDiv.innerHTML = `
                    <hr>
                    <h3>Joined Successfully!</h3>
                    <p><strong>⚠️ SAVE THIS SECRET KEY:</strong> ${data.secretKey}</p>
                    <p><em>You need this key to login to the dashboard.</em></p>
                    <br>
                    <p>Copy this code to your website footer:</p>
                    <textarea rows="5" cols="50" readonly>${data.snippet}</textarea>
                `;
                e.target.reset();
                btn.textContent = originalText;
                btn.disabled = false;
                loadMembers(); 
            } else {
                alert(data.error || "Error joining");
                btn.textContent = originalText;
                btn.disabled = false;
            }
        } catch (err) {
            alert("Server Error");
            btn.textContent = originalText;
            btn.disabled = false;
        }
    });
    
    // Initial Load
    loadMembers();
</script>
</body>
</html>
