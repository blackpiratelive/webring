<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSutra: The Indian Small Web</title>
    <style>
        /* --- Theme Variables --- */
        :root {
            --bg: #0a0a0a;
            --card-bg: #141414;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --border: #333;
            
            /* Indian Flag Palette */
            --saffron: #FF9933;
            --white: #ffffff;
            --green: #138808;
            
            /* Gradients */
            --tricolor-gradient: linear-gradient(90deg, var(--saffron), #e0e0e0, var(--green));
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        #container { max-width: 900px; margin: 0 auto; }

        /* --- Header --- */
        header { text-align: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        h1 { font-size: 2.5rem; margin-bottom: 10px; color: var(--text-primary); }
        header p { color: var(--text-secondary); max-width: 600px; margin: 0 auto; }
        
        a { color: var(--saffron); text-decoration: none; transition: color 0.2s; }
        a:hover { color: var(--white); }
        .nav-link { position: absolute; top: 20px; right: 20px; border: 1px solid var(--border); padding: 8px 12px; border-radius: 4px; font-size: 0.9rem; background: var(--card-bg); }
        .nav-link:hover { border-color: var(--saffron); }

        /* --- Sections --- */
        section { margin-bottom: 50px; }
        h2 { border-left: 4px solid var(--saffron); padding-left: 10px; margin-bottom: 20px; }

        /* --- Join Form --- */
        form { background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); display: grid; gap: 15px; max-width: 600px; margin: 0 auto; }
        
        input { 
            width: 100%; padding: 12px; border-radius: 6px; 
            border: 1px solid var(--border); background: #000; 
            color: var(--text-primary); font-size: 1rem; box-sizing: border-box; 
        }
        input:focus { outline: none; border-color: var(--saffron); }

        button.submit-btn {
            width: 100%; padding: 12px; border-radius: 6px; border: none;
            background: var(--tricolor-gradient); color: #000; font-weight: 800;
            font-size: 1rem; cursor: pointer; transition: opacity 0.2s;
        }
        button.submit-btn:hover { opacity: 0.9; }

        /* --- Filter Pills --- */
        .filter-pills { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .filter-pills label { cursor: pointer; flex: 1; text-align: center; max-width: 150px; }
        .filter-pills input { display: none; }
        .filter-pills span {
            display: block; padding: 8px 16px; border-radius: 50px; font-size: 0.9rem;
            font-weight: 600; background: #222; color: #888; border: 1px solid var(--border);
            transition: all 0.2s;
        }

        /* Filter Active States */
        .filter-pills input[value="verified"]:checked + span { background: var(--green); color: #fff; border-color: var(--green); }
        .filter-pills input[value="pending"]:checked + span { background: var(--saffron); color: #000; border-color: var(--saffron); }
        .filter-pills input[value="all"]:checked + span { background: var(--white); color: #000; border-color: var(--white); }

        /* --- TABLE STYLES --- */
        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card-bg);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap; /* Keeps rows on one line */
        }

        th, td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: #000;
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        td { font-size: 0.95rem; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255, 255, 255, 0.02); }

        .site-link { color: var(--text-secondary); font-family: monospace; font-size: 0.9rem; }
        .site-link:hover { color: var(--white); text-decoration: underline; }

        /* Status Badges */
        .badge { padding: 4px 10px; border-radius: 50px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-verified { background: #002200; color: var(--green); border: 1px solid var(--green); }
        .badge-pending { background: #331a00; color: var(--saffron); border: 1px solid var(--saffron); }

        /* Visit Button */
        .visit-btn {
            padding: 6px 12px; border-radius: 4px; font-size: 0.85rem; font-weight: 700;
            text-decoration: none; background: var(--tricolor-gradient); color: #000;
            border: none; display: inline-block;
        }
        .visit-btn:hover { opacity: 0.9; color: #000; }

        /* --- Footer & Helpers --- */
        footer { margin-top: 60px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center; font-size: 0.9rem; color: var(--text-secondary); }
        #result { display: none; margin-top: 20px; max-width: 600px; margin-left: auto; margin-right: auto; }
        .key-box { background: #220a00; border: 1px solid var(--saffron); color: var(--saffron); padding: 15px; border-radius: 4px; margin-bottom: 15px; word-break: break-all; }
        .code-box { background: #000; padding: 15px; border: 1px solid var(--border); overflow-x: auto; border-radius: 4px; font-family: monospace; color: #ccc; }
    </style>
</head>
<body>

<div id="container">
    <a href="dashboard.html" class="nav-link">Member Login</a>
    
    <header>
        <h1>WebSutra 🕸️</h1>
        <p>The Indian Small Web. Connected.</p>
    </header>

    <section id="join-section">
        <h2 style="text-align: center; border: none; margin-bottom: 10px;">Join the Ring</h2>
        <form id="joinForm">
            <input type="text" id="title" placeholder="Site Name (e.g. Rohit's Garden)" required>
            <input type="url" id="url" placeholder="URL (e.g. https://rohit.me)" required>
            <div style="position:relative">
                <input type="text" id="slug" placeholder="Unique ID" required pattern="[a-zA-Z0-9-]+" style="margin-bottom: 5px;">
                <small style="color: var(--text-secondary); font-size: 0.75rem; display: block;">Letters, numbers, and hyphens only (e.g. rohit-notes)</small>
            </div>
            <input type="email" id="email" placeholder="Email (Private, for recovery)" >
            <button type="submit" class="submit-btn">Join & Get Code</button>
        </form>

        <div id="result"></div>
    </section>

    <section id="directory-section">
        <h2>Members Directory</h2>
        
        <div class="filter-pills">
            <label>
                <input type="radio" name="filter" value="verified" checked onchange="filterSites()">
                <span>Verified</span>
            </label>
            <label>
                <input type="radio" name="filter" value="pending" onchange="filterSites()">
                <span>Pending</span>
            </label>
            <label>
                <input type="radio" name="filter" value="all" onchange="filterSites()">
                <span>All</span>
            </label>
        </div>

        <div class="table-responsive">
            <table id="members-table">
                <thead>
                    <tr>
                        <th>Site Name</th>
                        <th>URL</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="members-body">
                    <tr><td colspan="4" style="text-align:center; padding: 30px; opacity: 0.5;">Loading directory...</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <footer>
        <p>WebSutra is open source. <a href="dashboard.html">Manage your site</a></p>
        <p>Made by <a href="https://blackpiratex.com" target="_blank">BlackPiratex</a></p>
    </footer>
</div>

<script>
    let allSites = [];

    // 1. Fetch Members
    async function loadMembers() {
        const tableBody = document.getElementById('members-body');
        try {
            const res = await fetch('/api/members');
            if (!res.ok) throw new Error("Failed");
            
            allSites = await res.json();
            
            if (allSites.length === 0) {
                tableBody.innerHTML = "<tr><td colspan='4' style='text-align:center; padding: 30px;'>No members yet.</td></tr>";
                return;
            }
            filterSites();

        } catch (e) {
            console.error(e);
            tableBody.innerHTML = "<tr><td colspan='4' style='text-align:center; color: var(--saffron);'>Error loading directory.</td></tr>";
        }
    }

    // 2. Filter Logic (Table Version)
    function filterSites() {
        const filterValue = document.querySelector('input[name="filter"]:checked').value;
        const tableBody = document.getElementById('members-body');
        
        const filteredSites = allSites.filter(site => {
            if (filterValue === 'all') return true;
            return site.status === filterValue;
        });

        if (filteredSites.length === 0) {
             tableBody.innerHTML = `<tr><td colspan='4' style='text-align:center; padding: 30px; color: #666;'>No ${filterValue} sites found.</td></tr>`;
             return;
        }

        tableBody.innerHTML = filteredSites.map(site => {
            const badgeClass = site.status === 'verified' ? 'badge-verified' : 'badge-pending';
            const badgeText = site.status === 'verified' ? 'Verified' : 'Pending';
            
            return `
                <tr>
                    <td style="font-weight: 600; color: #fff;">${site.title}</td>
                    <td><a href="${site.url}" target="_blank" class="site-link">${site.url}</a></td>
                    <td><span class="badge ${badgeClass}">${badgeText}</span></td>
                    <td><a href="${site.url}" target="_blank" class="visit-btn">Visit &rarr;</a></td>
                </tr>
            `;
        }).join('');
    }

    // 3. Signup Logic
    document.getElementById('joinForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const originalText = btn.textContent;
        btn.textContent = "Processing...";
        btn.disabled = true;
        
        const payload = {
            title: document.getElementById('title').value,
            url: document.getElementById('url').value,
            slug: document.getElementById('slug').value,
            email: document.getElementById('email').value
        };

        try {
            const res = await fetch('/api/join', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            
            if (data.success) {
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `
                    <div class="key-box">
                        <strong>⚠️ SAVE THIS SECRET KEY:</strong><br>
                        <span style="font-family: monospace; font-size: 1.1em; user-select: all;">${data.secretKey}</span>
                        <br><small>You need this to login to the dashboard.</small>
                    </div>
                    <p>Copy this code to your website:</p>
                    <div class="code-box">${data.snippet.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
                `;
                e.target.reset();
                btn.textContent = "Joined Successfully!";
                loadMembers(); 
            } else {
                alert(data.error || "Error joining");
                btn.textContent = originalText;
                btn.disabled = false;
            }
        } catch (err) {
            alert("Server Error");
            btn.textContent = originalText;
            btn.disabled = false;
        }
    });
    
    loadMembers();
</script>
</body>
</html>
