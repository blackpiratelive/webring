<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset WebSutra Secret</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="main">
    <header>
        <h1>Reset Secret Key</h1>
        <a href="/">Home</a>
    </header>

    <hr>

    <section id="resetSection">
        <p>This link can generate a new dashboard secret key one time.</p>
        <button id="resetBtn" onclick="resetSecret()">Generate New Secret Key</button>
        <div id="result"></div>
    </section>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';

    if (!token) {
        document.getElementById('resetBtn').disabled = true;
        document.getElementById('result').innerHTML = '<p>Missing reset token.</p>';
    }

    async function resetSecret() {
        const btn = document.getElementById('resetBtn');
        const result = document.getElementById('result');
        btn.disabled = true;
        btn.textContent = 'Generating...';

        try {
            const res = await fetch('/api/reset-secret', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token })
            });
            const data = await res.json();

            if (!data.success) {
                throw new Error(data.error || 'Could not reset secret key');
            }

            result.innerHTML = `
                <hr>
                <h3>New Secret Key</h3>
                <p><strong>SAVE THIS SECRET KEY:</strong> ${data.secretKey}</p>
                <p><em>This key is shown only once. The reset link cannot be used again.</em></p>
                <p><a href="/dashboard.html">Go to dashboard</a></p>
            `;
            btn.style.display = 'none';
        } catch (error) {
            result.innerHTML = `<p>${error.message}</p>`;
            btn.disabled = false;
            btn.textContent = 'Generate New Secret Key';
        }
    }
</script>
</body>
</html>
